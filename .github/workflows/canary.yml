name: Canary

on:
  push:
    branches: [canary]

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  canary:
    name: Canary Release
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      - name: Set canary version
        env:
          CANARY_SUFFIX: canary.${{ github.run_id }}.${{ github.sha }}
        run: pnpm canary:version

      - name: Publish canary
        run: pnpm canary:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
